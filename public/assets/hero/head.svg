<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38 -116 76 122" width="76" height="122">
  <defs>
    <linearGradient id="st" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6c7682"/><stop offset="0.45" stop-color="#dfe5eb"/><stop offset="0.62" stop-color="#f6f8fa"/><stop offset="1" stop-color="#8d98a4"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5c6670"/><stop offset="0.55" stop-color="#b9c2ca"/><stop offset="1" stop-color="#6d7781"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6f7984"/><stop offset="1" stop-color="#a9b3bc"/>
    </linearGradient>
    <pattern id="rings" width="4.4" height="3.8" patternUnits="userSpaceOnUse">
      <path d="M0,3.8 A2.2,2.2 0 0 1 4.4,3.8" fill="none" stroke="#4e5862" stroke-width="0.85" opacity="0.8"/>
    </pattern>
    <radialGradient id="skin" cx="0.6" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#f2c49c"/><stop offset="1" stop-color="#d9a079"/>
    </radialGradient>
  </defs>
  <!-- barmitsa: thick, hangs onto the shoulders -->
  <path d="M-26,-50 C-34,-30 -34,-8 -29,2 C-14,8 8,8 19,0 C12,-5 6,-8 2,-10 C-6,-14 -10,-22 -10,-30 L-10,-48 Z" fill="url(#mail)" stroke="#2a180e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-26,-50 C-34,-30 -34,-8 -29,2 C-14,8 8,8 19,0 C12,-5 6,-8 2,-10 C-6,-14 -10,-22 -10,-30 L-10,-48 Z" fill="url(#rings)"/>
  <!-- face (only the eye strip is visible) -->
  <path d="M-11,-48 L26,-48 C31,-42 32,-32 30,-25 C29,-18 27,-13 22,-10 C16,-5 6,-5 0,-9 C-6,-13 -11,-21 -11,-30 Z" fill="url(#skin)" stroke="#2a180e" stroke-width="3" stroke-linejoin="round"/>
  <!-- eye socket shadow -->
  <path d="M0,-38 C8,-40 22,-40 31,-37 L30,-27 L0,-27 Z" fill="#7a4a2c" opacity="0.28"/>
  <!-- eyes: narrow, hard stare -->
  <path d="M4,-33 C6,-35.5 12,-35.5 14.5,-32.5 C12,-30 7,-30 4,-33 Z" fill="#fff" stroke="#2a180e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M20,-33 C22,-35 26.5,-35 28,-32.5 C26,-30.5 22,-30.5 20,-33 Z" fill="#fff" stroke="#2a180e" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="11" cy="-32.8" r="2" fill="#24384f"/>
  <circle cx="25.4" cy="-32.8" r="1.7" fill="#24384f"/>
  <circle cx="10.6" cy="-33.4" r="0.6" fill="#fff"/>
  <!-- brows: heavy, frowning -->
  <path d="M1,-40 L15,-35.5" stroke="#5a3412" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M19,-35.8 L29.5,-39.5" stroke="#5a3412" stroke-width="3.6" stroke-linecap="round"/>
  <!-- forelock -->
  <path d="M3,-49 C5,-43 9,-42 12,-45 C14,-41 19,-41 21,-46 C23,-43 27,-43 28,-47 L27,-50 Z" fill="#c98f3a" stroke="#2a180e" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- lichina: steel half-mask over the lower face -->
  <path d="M-6,-27 L31,-28 C34,-22 33,-15 29,-10 C23,-3 12,-1 3,-4 C-3,-6 -7,-11 -9,-16 Z" fill="url(#mask)" stroke="#2a180e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-6,-27 L31,-28 L31.5,-24.5 L-7,-23.5 Z" fill="#e3b23c" stroke="#2a180e" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M27,-24 C31,-21 31,-17 28,-15" fill="none" stroke="#2a180e" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14,-15 L25,-15.5 M13,-11 L23,-11.5 M14,-7.5 L21,-8" stroke="#1d242b" stroke-width="2" stroke-linecap="round"/>
  <path d="M4,-21 C8,-16 9,-10 7,-5" fill="none" stroke="#e8eef3" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="-3" cy="-18" r="1.6" fill="#e3b23c" stroke="#2a180e" stroke-width="0.8"/>
  <circle cx="1" cy="-9" r="1.6" fill="#e3b23c" stroke="#2a180e" stroke-width="0.8"/>
  <!-- helmet: pennant, dome, spike, band -->
  <path d="M5,-106 C-4,-112 -14,-104 -26,-109 C-20,-100 -9,-99 5,-100 Z" fill="#c4352a" stroke="#2a180e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M-25,-52 C-24,-72 -9,-86 3,-98 C14,-86 30,-72 31,-52 Z" fill="url(#st)" stroke="#2a180e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M9,-88 C14,-80 18,-70 19,-58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M3,-97 L3,-56" stroke="#7d8894" stroke-width="1.6" opacity="0.7"/>
  <rect x="1" y="-109" width="4.4" height="13" rx="1.5" fill="#e3b23c" stroke="#2a180e" stroke-width="2"/>
  <circle cx="3.2" cy="-110" r="3" fill="#e3b23c" stroke="#2a180e" stroke-width="2"/>
  <path d="M-27,-55 C-10,-60 16,-60 33,-55 L33,-46 C16,-51 -10,-51 -27,-46 Z" fill="#e3b23c" stroke="#2a180e" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="-18" cy="-51" r="1.5" fill="#8a5a10"/><circle cx="-6" cy="-53" r="1.5" fill="#8a5a10"/>
  <circle cx="8" cy="-53.3" r="1.5" fill="#8a5a10"/><circle cx="21" cy="-52" r="1.5" fill="#8a5a10"/>
  <!-- nasal guard -->
  <path d="M27,-50 L31,-50 L30.5,-34 L27.5,-34 Z" fill="url(#st)" stroke="#2a180e" stroke-width="1.8" stroke-linejoin="round"/>
</svg>

    <linearGradient id="pp" x1="0" x2="-1" y1="0" y2="-0.6">
      <stop offset="0" stop-color="#d8c79a"/><stop offset="1" stop-color="#f4ead0"/>
    </linearGradient>
  </defs>
  <!-- нижнее крыло -->
  <path d="M-4,4 L-96,22 Q-100,2 -94,-12 Q-84,-18 -78,-26 Q-62,-28 -52,-38 Z" fill="url(#pp)" stroke="#3a2a16" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
  <path d="M-4,4 L-94,10 M-4,4 L-86,-10 M-4,4 L-66,-28" fill="none" stroke="#5a3a1a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- верхнее крыло -->
  <path d="M0,0 L-104,-30 Q-104,-52 -92,-64 Q-80,-66 -72,-78 Q-54,-80 -44,-90 L-30,-82 Z" fill="url(#pp)" stroke="#3a2a16" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0,0 L-102,-40 M0,0 L-94,-60 M0,0 L-72,-76 M0,0 L-44,-88" fill="none" stroke="#5a3a1a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- надрывы и пятна -->
  <path d="M-86,-46 L-80,-42 L-84,-36" fill="none" stroke="#3a2a16" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="-60" cy="-56" rx="5" ry="3" fill="#b8a070" opacity="0.6"/>
  <ellipse cx="-70" cy="0" rx="4" ry="2.4" fill="#b8a070" opacity="0.6"/>
  <circle cx="0" cy="0" r="5" fill="#7a5a2a" stroke="#050405" stroke-width="2"/>
</svg>

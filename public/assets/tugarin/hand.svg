<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -13 30 30" width="30" height="30">
  <!-- Кулак, обхвативший рукоять. Ось рукояти вертикальна (как у меча и ручки щита),
       поэтому пальцы — горизонтальные полосы, костяшки смотрят вперёд (+x). (0,0) — центр рукояти. -->
  <defs>
    <radialGradient id="skin" cx="0.6" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#8fd070"/><stop offset="1" stop-color="#3f7a3a"/>
    </radialGradient>
  </defs>
  <path d="M-8,-7 C-11.5,-4 -11.5,10 -8,13 L5,13.5 C10,13.5 13,10.5 13,7 L13,-1 C13,-5 10,-7.5 5,-7.5 Z" fill="url(#skin)" stroke="#2a180e" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- четыре пальца -->
  <path d="M1.5,-2.6 C6,-3.4 10,-3.2 12.6,-2.2 M1.5,2.4 C6,1.6 10,1.8 13,2.6 M1.5,7.4 C6,6.8 10,7 12.6,7.8" fill="none" stroke="#24461f" stroke-width="1.7" stroke-linecap="round"/>
  <!-- костяшки -->
  <path d="M12.8,-4.6 Q14.4,-2.6 12.8,-0.4 M13,0.4 Q14.6,2.6 13,4.8 M12.8,5.4 Q14.2,7.4 12.6,9.4" fill="none" stroke="#2a180e" stroke-width="1.3" stroke-linecap="round"/>
  <!-- большой палец поверх пальцев -->
  <path d="M-7.5,-6.5 C-6,-11.5 5,-11.5 9,-7 C5.5,-4.4 -3,-4 -7.5,-6.5 Z" fill="url(#skin)" stroke="#2a180e" stroke-width="2.2" stroke-linejoin="round"/>
</svg>

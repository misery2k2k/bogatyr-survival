<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38 -122 80 128" width="80" height="128">
  <!-- Тугарин Змеевич: змеиная морда, клыки, жёлтые глаза, рогатый шлем, чёрная грива. (0,0) — шея. -->
  <defs>
    <linearGradient id="st" x1="0" x2="1">
      <stop offset="0" stop-color="#16161a"/><stop offset="0.5" stop-color="#4a4a54"/><stop offset="1" stop-color="#222228"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.6" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#8fd070"/><stop offset="1" stop-color="#3f7a3a"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#b8a47a"/>
    </linearGradient>
  </defs>
  <!-- грива -->
  <path d="M-24,-52 C-36,-34 -38,-10 -30,4 C-20,-2 -14,-6 -8,-6 C-14,-14 -12,-30 -10,-48 Z" fill="#0e0c10" stroke="#050405" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M-30,-30 C-34,-18 -33,-6 -28,0 M-22,-40 C-26,-26 -25,-12 -20,-4" fill="none" stroke="#3a3440" stroke-width="2" stroke-linecap="round"/>
  <!-- морда -->
  <path d="M-12,-48 L26,-48 C32,-42 34,-32 33,-24 C34,-18 31,-12 26,-8 C18,-2 6,-2 -1,-6 C-8,-11 -12,-20 -12,-30 Z" fill="url(#skin)" stroke="#0a1408" stroke-width="3" stroke-linejoin="round"/>
  <!-- чешуйки -->
  <path d="M-6,-24 q3,-3 6,0 M-8,-16 q3,-3 6,0 M2,-14 q3,-3 6,0 M-2,-34 q3,-3 6,0" fill="none" stroke="#2f5a2a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- надбровье и глаза-щёлки -->
  <path d="M2,-41 L16,-35 L15,-38.5 L3,-44.5 Z" fill="#24461f" stroke="#0a1408" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M19,-35.5 L31,-40.5 L30,-43 L19,-38.5 Z" fill="#24461f" stroke="#0a1408" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M4,-33 C7,-36.5 13,-36.5 15.5,-32.5 C12.5,-29.5 7,-29.5 4,-33 Z" fill="#ffd23a" stroke="#0a1408" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M20,-33 C22.5,-36 27.5,-36 29.5,-32.5 C27,-30 22.5,-30 20,-33 Z" fill="#ffd23a" stroke="#0a1408" stroke-width="1.4" stroke-linejoin="round"/>
  <ellipse cx="10.4" cy="-32.8" rx="1" ry="2.8" fill="#120a04"/>
  <ellipse cx="25" cy="-32.8" rx="0.9" ry="2.5" fill="#120a04"/>
  <!-- ноздри -->
  <path d="M30,-25 q2,1 1.5,3" fill="none" stroke="#0a1408" stroke-width="1.6" stroke-linecap="round"/>
  <!-- пасть с клыками -->
  <path d="M8,-15 C14,-11 24,-11 31,-17 C30,-12 26,-7 18,-7 C12,-7 9,-10 8,-15 Z" fill="#5a0a08" stroke="#0a1408" stroke-width="2" stroke-linejoin="round"/>
  <path d="M12,-14 L13.5,-9.5 L15,-13.5 Z M24,-13.4 L25.5,-9 L27,-14.6 Z" fill="#fffbe8" stroke="#0a1408" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M18,-8 L19.5,-12 L21,-8 Z" fill="#fffbe8" stroke="#0a1408" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- рога шлема -->
  <path d="M-16,-58 C-28,-70 -34,-90 -26,-108 C-24,-92 -18,-78 -6,-66 Z" fill="url(#horn)" stroke="#2a1a0e" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M20,-62 C30,-74 38,-90 34,-110 C28,-94 22,-82 10,-70 Z" fill="url(#horn)" stroke="#2a1a0e" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- шлем -->
  <path d="M-25,-52 C-24,-70 -10,-82 3,-90 C16,-82 30,-70 31,-52 Z" fill="url(#st)" stroke="#050405" stroke-width="3" stroke-linejoin="round"/>
  <path d="M8,-82 C14,-74 18,-66 19,-58" fill="none" stroke="#9a9aa8" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M1,-100 L5,-100 L6,-88 L0,-88 Z" fill="#2a2a30" stroke="#050405" stroke-width="1.8"/>
  <path d="M3,-100 C-6,-112 -16,-106 -24,-114 C-20,-100 -8,-96 3,-94 Z" fill="#9b1a12" stroke="#050405" stroke-width="2" stroke-linejoin="round"/>
  <path d="M-27,-55 C-10,-60 16,-60 33,-55 L33,-47 C16,-52 -10,-52 -27,-47 Z" fill="#6a0e0a" stroke="#050405" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="-16" cy="-51" r="1.6" fill="#c9c9d2"/><circle cx="-2" cy="-53" r="1.6" fill="#c9c9d2"/>
  <circle cx="12" cy="-53.2" r="1.6" fill="#c9c9d2"/><circle cx="25" cy="-52" r="1.6" fill="#c9c9d2"/>
</svg>
